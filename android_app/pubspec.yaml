name: LokSeva
description: NMMC LokSeva - Citizen Services Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  http: ^1.2.0
  http_parser: ^4.0.2
  mime: ^1.0.4
  url_launcher: ^6.2.5
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0

  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Local Storage
  shared_preferences: ^2.2.0

  # UI & Design
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  intl: ^0.18.0
  
  # Image Picker
  image_picker: ^1.0.0
  file_picker: ^8.0.0
  
  # Animations
  animations: ^2.0.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Form Validation
  form_validator: ^2.1.1
  
  # Connectivity
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/announcement_banner.jpeg
    - assets/images/announcement_person.jpeg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
